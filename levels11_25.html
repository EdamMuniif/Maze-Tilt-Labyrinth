<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('maze'),ctx=canvas.getContext('2d'),field=$('field'),overlay=$('modal'),contents=$('contents');
const SIZE=36, N=1,E=2,S=4,W=8,DIRS=[[0,-1,N,S],[1,0,E,W],[0,1,S,N],[-1,0,W,E]],BALL=8.6,HALF=2.5,SEED=13469027;
const Z=(x,a,b)=>Math.max(a,Math.min(b,x)),rng=(a)=>()=>{a|=0;a=(a+0x6d2b79f5)|0;let t=Math.imul(a^(a>>>15),1|a);t^=t+Math.imul(t^(t>>>7),61|t);return ((t^(t>>>14))>>>0)/4294967296};
const STAGES=[
 [11,'The Crosswind',17,19,0,0,0,0,0,4,'Long winding corridors and misleading dead ends.'],
 [12,'Twin Rifts',19,19,1,0,0,0,0,4,'Touch a wormhole to teleport to its partner.'],
 [13,'Veil of Turns',19,21,0,1,0,0,0,3,'Your surroundings appear as you move.'],
 [14,'Edgefall',21,21,0,0,5,0,0,4,'Dark floor openings send you back to the start.'],
 [15,'Rift in the Mist',21,23,2,1,0,0,0,3,'Navigate fog and jump between linked wormholes.'],
 [16,'The Maw',23,23,0,0,0,1,0,4,'Avoid the roaming hunter; it follows corridors.'],
 [17,'Fragile Glass',23,25,0,0,0,0,1,4,'Wall impacts lower your health and vibrate the phone.'],
 [18,'Void Hunter',25,25,0,0,8,1,1,4,'Avoid pits, wall damage, and the hunter.'],
 [19,'Four Portals',25,27,4,1,0,0,0,3,'Wormhole pairs are color-coded; learn their exits.'],
 [20,'Eclipse',27,27,1,1,5,1,1,3,'A fog-covered maze with every turn a risk.'],
 [21,'Rift Gauntlet',27,29,2,0,10,2,1,4,'Two hunters prowl while unstable floors collapse.'],
 [22,'Night Vision',29,29,1,1,8,2,1,2,'Your visibility is extremely limited.'],
 [23,'Wormhole Riot',29,31,4,1,12,2,1,3,'Multiple exits, hunters, gaps, and damaged marble.'],
 [24,'Abyss Spiral',31,31,3,1,16,3,1,2,'Three hunters patrol an enormous dark labyrinth.'],
 [25,'The Unknown',33,33,4,1,20,3,1,2,'Final exam: survive every hazard and find the exit.']
];
const stages=STAGES.map(([num,name,cols,rows,portals,fog,pits,hunters,damage,vision,desc])=>({num,name,cols,rows,portals,fog:!!fog,pits,hunters,damage:!!damage,vision,desc}));
const STORE='orbrinth-chapter2-v2',empty=()=>({best:{},times:{},completed:{},theme:'night'});
const nameSafe=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const cleanName=x=>String(x||'').trim().replace(/[^a-zA-Z0-9 _-]/g,'').slice(0,18)||'Player';
const playerKey=x=>cleanName(x).toLowerCase();
let archive;try{archive=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(_){archive={}}
if(!archive||typeof archive!=='object'||!archive.players)archive={players:{},active:'',theme:'night'};
let originalPlayer=null;
try{const profiles=JSON.parse(localStorage.getItem('tilt-labyrinth-v6-profiles')||'{}');
 const active=localStorage.getItem('tilt-labyrinth-v6-active');if(active&&profiles[active])originalPlayer=cleanName(profiles[active].name)}catch(_){/* Original records are read-only. */}
let activeName=cleanName(archive.active||originalPlayer||'Player');
const recordFor=name=>{const k=playerKey(name);if(!archive.players[k])archive.players[k]=empty();return archive.players[k]};
let saved=recordFor(activeName);
const save=()=>{archive.active=activeName;try{localStorage.setItem(STORE,JSON.stringify(archive))}catch(_){}};
let ui='home',stage=null,maze=null,ball={x:0,y:0,vx:0,vy:0},sec=0,health=5,maxHealth=5,attempts=0,wallHits=0,pickups=0,warps=0,invuln=0,warpCD=0,fallGrace=0,rearm=false,rearmTime=0,seen=null,visible=null,senseCell=-1,positionCam={x:0,y:0},sensor=null,baseline=null,sensorAt=0,permissionRequested=false,tPrev=0,hitAt=-100,enemyAt=0,pausedFrom='playing',width=0,height=0,dpr=1,scale=1,currentLevel=11,lastEvent='';
const pad=n=>String(n).padStart(2,'0'),clock=t=>`${pad(Math.floor(t/60))}:${pad(Math.floor(t%60))}`;
const levelKey=n=>String(n),fmt=n=>Math.round(n).toLocaleString('en-US');
const cell=(x,y,c)=>y*c+x,coords=(id,c)=>[id%c,Math.floor(id/c)],inside=(x,y,c,r)=>x>=0&&y>=0&&x<c&&y<r;
function neighbors(m,id){const [x,y]=coords(id,m.cols),out=[];for(const [dx,dy,bit] of DIRS){const xx=x+dx,yy=y+dy;if(inside(xx,yy,m.cols,m.rows)&&!(m.walls[id]&bit))out.push(cell(xx,yy,m.cols))}return out}
function shortest(m,start,goal){const q=[start],dist=new Int32Array(m.cols*m.rows).fill(-1),par=new Int32Array(dist.length).fill(-1);dist[start]=0;for(let t=0;t<q.length;t++){const a=q[t];for(const b of neighbors(m,a))if(dist[b]<0){dist[b]=dist[a]+1;par[b]=a;q.push(b)}}const path=[];if(dist[goal]>=0)for(let a=goal;a!==-1;a=par[a]){path.push(a);if(a===start)break}return{distance:dist[goal],path:path.reverse(),reached:q.length}}
function buildGrid(p,seed){const cols=p.cols,rows=p.rows,count=cols*rows,start=cell(0,rows-1,cols),goal=cell(cols-1,0,cols);let best=null;
 for(let attempt=0;attempt<(p.num===25?42:6);attempt++){
  const random=rng((seed+attempt*2654435761)>>>0),walls=new Uint8Array(count).fill(15),seen=new Uint8Array(count),stack=[start];seen[start]=1;
  while(stack.length){const a=stack[stack.length-1],x=a%cols,y=Math.floor(a/cols),possible=[];for(const [dx,dy,bit,op] of DIRS){const xx=x+dx,yy=y+dy;if(inside(xx,yy,cols,rows)){const b=cell(xx,yy,cols);if(!seen[b])possible.push([b,bit,op])}}
   if(!possible.length){stack.pop();continue}const [b,bit,op]=possible[Math.floor(random()*possible.length)];walls[a]&=~bit;walls[b]&=~op;seen[b]=1;stack.push(b)}
  const m={cols,rows,walls,start,goal},result=shortest(m,start,goal);if(result.distance<0||result.reached!==count)throw Error('Maze not connected');if(!best||result.distance>best.path.length-1)best={m,path:result.path};
 }const m=best.m; m.path=best.path;m.routeSet=new Set(m.path);m.pits=new Set();m.gates=[];m.enemies=[];const random=rng(seed^0x55c3a47f);
 const candidates=Array.from({length:count},(_,i)=>i).filter(i=>i!==start&&i!==goal&&!m.routeSet.has(i)&&Math.abs((i%cols)-(start%cols))+Math.abs(Math.floor(i/cols)-Math.floor(start/cols))>5);
 for(let i=candidates.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[candidates[i],candidates[j]]=[candidates[j],candidates[i]]}
 // Traps occupy optional off-route branches, never the guaranteed path.
 for(const i of candidates){if(m.pits.size>=p.pits)break;if(neighbors(m,i).length===1)m.pits.add(i)}
 for(const i of candidates){if(m.pits.size>=p.pits)break;if(!m.pits.has(i))m.pits.add(i)}
 // Wormhole endpoints are safe, widely spaced, and never occupy the start, goal or pits.
 const gateCells=best.path.filter((i,idx)=>idx>10&&idx<best.path.length-10&&idx%3===0&&!m.pits.has(i));
 const taken=new Set([start,goal]);for(let j=0;j<p.portals;j++){
  const a=gateCells[Math.floor((j+.2)/(p.portals+1)*gateCells.length)],b=gateCells[Math.floor((j+.82)/(p.portals+1)*gateCells.length)];
  if(a===undefined||b===undefined||a===b||taken.has(a)||taken.has(b))continue;
  m.gates.push({a,b,color:['#44d7ff','#af7aff','#ff6dbc','#ffce6d'][j%4]});taken.add(a);taken.add(b)
 }
 for(let i=0;i<p.hunters;i++){
  const options=candidates.filter(id=>!m.pits.has(id)&&!taken.has(id));if(!options.length)break;
  const startCell=options[Math.floor((i+.33)/(p.hunters+1)*options.length)];m.enemies.push({cell:startCell,spawn:startCell,x:startCell%cols+.5,y:Math.floor(startCell/cols)+.5,t:0,stunned:2.1+i*.5,heading:0});taken.add(startCell);
 }
 // Open edges are additional fall hazards on optional boundary branches only.
 // Their cells are never on the guaranteed solution route or a portal/pit/enemy spawn.
 m.edgeGaps=[];
 if(p.pits){
   const boundary=candidates.filter(id=>!m.pits.has(id)&&!taken.has(id)&&!m.routeSet.has(id)&&(
     id%cols===0||id%cols===cols-1||Math.floor(id/cols)===0||Math.floor(id/cols)===rows-1));
   const targetCount=Math.min(p.num>=23?4:p.num>=19?3:2,boundary.length);
   for(const id of boundary){if(m.edgeGaps.length>=targetCount)break;
     const x=id%cols,y=Math.floor(id/cols);const bit=x===0?W:x===cols-1?E:y===0?N:S;
     // Keep gaps spaced apart; do not turn an adjacent border stretch into a single long opening.
     if(m.edgeGaps.some(e=>Math.abs((e.id%cols)-x)+Math.abs(Math.floor(e.id/cols)-y)<4))continue;
     m.walls[id]&=~bit;m.edgeGaps.push({id,bit});taken.add(id);
   }
 }
 return m;
}
function beginStage(n){currentLevel=n;stage=stages.find(s=>s.num===n);maze=buildGrid(stage,(SEED^Math.imul(stage.num,0x9e3779b9))>>>0);ball={x:.5,y:maze.rows-.5,vx:0,vy:0};seen=new Uint8Array(maze.rows*maze.cols);visible=new Uint8Array(seen.length);senseCell=-1;health=maxHealth=n>=21?7:5;sec=0;attempts=0;wallHits=0;warps=0;invuln=1.2;warpCD=0;fallGrace=1;rearm=false;rearmTime=0;enemyAt=0;updateFog(true);renderHUD();calibrationReset();}
function hazards(p){const a=[];if(p.portals)a.push(`${p.portals} wormhole ${p.portals===1?'pair':'pairs'}`);if(p.fog)a.push(`Fog · ${p.vision}-step sight`);if(p.pits)a.push(`${p.pits} falling tiles + open edges`);if(p.hunters)a.push(`${p.hunters} roaming ${p.hunters===1?'hunter':'hunters'}`);if(p.damage)a.push('Wall damage + haptics');return a.length?a:['Pure maze challenge']}
function setModal(eyebrow,title,subtitle,html){$('eyebrow').textContent=eyebrow;$('modalTitle').textContent=title;$('subtitle').textContent=subtitle;contents.innerHTML=html;overlay.hidden=false}
function home(){ui='home';pauseMotion();const complete=Object.keys(saved.completed).filter(k=>saved.completed[k]).length;
 let list=stages.map(p=>`<button class="level ${saved.completed[p.num]?'done':''}" data-stage="${p.num}">${p.num}<small>${saved.completed[p.num]?'CLEARED':p.fog?'FOG':p.hunters?'HUNTER':p.portals?'WARP':'MAZE'}</small></button>`).join('');
 setModal('LEVELS 11–25 · CHAPTER II','ORBRINTH','TILT INTO THE UNKNOWN',`<p class="summary">15 challenging gyro-only levels with safe wormholes, fog, falling floor tiles and open edges, roaming hunters and wall-impact damage.</p><div class="player-row"><label for="playerName">PLAYER</label><input id="playerName" maxlength="18" value="${activeName}" aria-label="Your player nickname"><button id="switchPlayer">Switch</button></div><div class="progress">${complete}/15 completed · ${Object.keys(saved.best).length} best scores recorded</div><div class="levels">${list}</div><div class="actions duo"><button class="secondary" id="themeToggle">${saved.theme==='night'?'☀ Day Mode':'☾ Night Mode'}</button><button class="primary" id="startNewest">Start Level 11</button></div><div class="note">Play any level to test the expansion. Scores are local to this browser; no global leaderboard is claimed. Main ORBRINTH records are not modified. Switch nicknames to keep separate records on one device.</div><details style="margin-top:12px"><summary style="font-size:12px;color:#83dfff;font-weight:800;cursor:pointer">Leaderboard on this device</summary><div id="localRank" style="margin-top:7px;font-size:12px;line-height:1.7">${Object.entries(archive.players).map(([name,data])=>({name,points:Object.values(data.best||{}).reduce((a,b)=>a+Number(b||0),0)})).sort((a,b)=>b.points-a.points).slice(0,10).map((x,i)=>`<div style=\"border-bottom:1px solid #354568;padding:3px 0\">${i+1}. ${nameSafe(x.name)} · ${fmt(x.points)} pts</div>`).join('')}</div></details><div style="margin-top:14px"><a href="./" style="color:#86c9ff;font-weight:750;font-size:12px">← Return to ORBRINTH Levels 1–10 (when hosted together)</a></div>`);
 contents.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>brief(Number(b.dataset.stage))));$('startNewest').onclick=()=>brief(11);$('switchPlayer').onclick=()=>{activeName=cleanName($('playerName').value);saved=recordFor(activeName);save();home()};$('themeToggle').onclick=()=>{saved.theme=saved.theme==='night'?'day':'night';save();document.body.classList.toggle('day',saved.theme==='day');home()};
}
function brief(n){beginStage(n);ui='brief';const p=stage;const already=saved.best[n]?`Personal best: ${fmt(saved.best[n])} points · Best time ${clock(saved.times[n]||0)}`:'No completion recorded yet';
 setModal('BEFORE LEVEL '+n,`${pad(n)} · ${p.name}`,'TILT INTO THE UNKNOWN',`<p class="summary">${p.desc}</p><div class="chips">${hazards(p).map(x=>`<span class="chip">${x}</span>`).join('')}</div><p><strong>Objective:</strong> roll the marble from the blue start to the pink goal. Tilt your phone to steer. No touch/drag movement. Wormholes move you to linked locations. Dark holes and marked open boundary edges cause a fall. Avoid the original <strong>Maw</strong> hunter. Wall impacts cost health on damage levels; supported Android devices vibrate briefly.</p><p>Health: <strong>${maxHealth} points</strong>. If health reaches zero, the ball returns to the start and your attempt count increases. Fog slowly reveals connected corridors. The timer continues through retries.</p><div class="note">${already}</div><div class="actions duo sticky"><button class="secondary" id="backLevels">All levels</button><button class="primary" id="startTilt">Enable tilt & play</button></div>`);
 $('backLevels').onclick=home;$('startTilt').onclick=enableTilt;
}
function pauseMotion(){ball.vx=ball.vy=0}

const angleDelta=(a,b)=>{let d=a-b;while(d>180)d-=360;while(d< -180)d+=360;return d},deviceAngle=()=>{const a=screen.orientation?.angle;return Number.isFinite(a)?a:Number(window.orientation)||0};

function renderHUD(){$('levelNumber').textContent=`${currentLevel}/25`;$('time').textContent=clock(sec);$('health').textContent='●'.repeat(health)+'○'.repeat(maxHealth-health);$('health').style.color=health<=2?'#ff6b83':'#70dfc6';$('status').textContent=`${stage.name.toUpperCase()} · ${hazards(stage).slice(0,2).join(' · ').toUpperCase()} · ATTEMPTS ${attempts}`;}
function vibrate(ms=32){try{navigator.vibrate?.(ms)}catch(_){}}

function checkHazards(){if(fallGrace>0)return;const id=cell(Z(Math.floor(ball.x),0,maze.cols-1),Z(Math.floor(ball.y),0,maze.rows-1),maze.cols),x=id%maze.cols+.5,y=Math.floor(id/maze.cols)+.5;

function step(dt){if(ui!=='playing'||!maze)return;invuln=Math.max(0,invuln-dt);warpCD=Math.max(0,warpCD-dt);fallGrace=Math.max(0,fallGrace-dt);

function resize(){const rect=field.getBoundingClientRect();width=Math.max(10,rect.width);height=Math.max(10,rect.height);dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);canvas.style.width=width+'px';canvas.style.height=height+'px';scale=Z(width/(width>height?17:10.5),19,43)/SIZE}
function visibleHere(id){return !stage.fog||visible[id]||seen[id]}
function draw(t){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=saved.theme==='day'?'#e7f0fe':'#070f21';ctx.fillRect(0,0,width,height);if(!maze)return;

 for(const e of maze.enemies){const id=e.cell;if(!visibleHere(id))continue;ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.heading);ctx.fillStyle=e.stunned>0?'#727e99':'#ff9b55';ctx.shadowColor='#ff6542';ctx.shadowBlur=.2;ctx.beginPath();ctx.moveTo(.18,0);for(let i=0;i<=24;i++){const a=-2.5+(5*i/24);ctx.lineTo(Math.cos(a)*.34,Math.sin(a)*.34)}ctx.closePath();ctx.fill();ctx.fillStyle='#172747';ctx.beginPath();ctx.arc(.01,-.12,.06,0,Math.PI*2);ctx.fill();ctx.restore()}
